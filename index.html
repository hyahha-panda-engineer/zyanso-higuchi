<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀点数記録</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- 認証画面 -->
<div class="container" id="auth-screen">
    <h2>🔐 認証</h2>
    <div id="auth-error" class="error-msg"></div>
    <label>合言葉を入力</label>
    <input type="password" id="password-input" placeholder="パスワード">
    <button onclick="login()">ログイン</button>
</div>

<!-- メイン画面 -->
<div class="container hidden" id="main-screen">
    <!-- メインナビゲーション -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tab-daily" onclick="switchTab('daily')">📝 日別記録</button>
        <button class="tab-btn" id="tab-summary" onclick="switchTab('summary')">🏆 通算集計</button>
    </div>

    <!-- 1. 日別記録ビュー -->
    <div id="view-daily">
        <div class="section">
            <label>日付選択</label>
            <div class="date-row">
                <input type="date" id="target-date">
                <button onclick="fetchData()">🔄 読み込む</button>
            </div>
            <label style="margin-top: 8px;">過去の対局日から選択</label>
            <select id="past-dates-select" onchange="selectPastDate()">
                <option value="">過去の対局日を選択...</option>
            </select>
        </div>

        <div id="editing-banner" class="editing-banner hidden">
            ✏️ 編集モード中（第<span id="editing-target-num"></span>戦を修正中）
            <button class="btn-cancel" onclick="cancelEdit()">編集をやめる</button>
        </div>

        <div class="section">
            <label>ルール</label>
            <select id="game-mode" onchange="renderPlayerInputs()">
                <option value="4">4人打ち (ヨンマ)</option>
                <option value="3">3人打ち (サンマ)</option>
            </select>
        </div>

        <div class="section">
            <label>対局者とスコア（1箇所空欄にして計算ボタンで自動入力）</label>
            <div id="players-container"></div>
        </div>

        <button class="btn-calc" onclick="autoCalculateBlank()">🧮 空白を自動計算する</button>
        <button id="submit-btn" onclick="submitScore()">この半チャンを送信する</button>

        <hr class="divider">

        <h3>📈 本日のポイント推移グラフ</h3>
        <div class="chart-container">
            <canvas id="scoreChart"></canvas>
        </div>

        <div class="total-summary-box" style="margin-bottom: 20px;">
            <b>📊 本日のトータル成績:</b><br>
            <span id="total-text" class="empty-text">データなし</span>
        </div>

        <h3>📅 本日の対局履歴 (<span id="history-count">0</span>戦)</h3>
        <div id="history-container">
            <span class="empty-text">データなし</span>
        </div>
    </div>

    <!-- 2. 通算集計ビュー -->
    <div id="view-summary" class="hidden">
        <!-- フィルターセクション -->
        <div class="filter-box">
            <div class="filter-row">
                <div>
                    <label>ルール絞り込み</label>
                    <select id="filter-rule" onchange="renderSummaryView()">
                        <option value="all">全ルール (サンマ+ヨンマ)</option>
                        <option value="4">4人打ちのみ</option>
                        <option value="3">3人打ちのみ</option>
                    </select>
                </div>
                <div>
                    <label>期間・直近絞り込み</label>
                    <select id="filter-period" onchange="renderSummaryView()">
                        <option value="all">全期間</option>
                        <option value="recent10">直近10戦</option>
                        <option value="recent20">直近20戦</option>
                        <option value="recent50">直近50戦</option>
                        <option value="days30">過去30日</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 集計モード切り替えサブタブ -->
        <div class="sub-tabs">
            <button class="sub-tab-btn active" id="sub-tab-overall" onclick="switchSubTab('overall')">🌐 全体ランキング</button>
            <button class="sub-tab-btn" id="sub-tab-individual" onclick="switchSubTab('individual')">👤 個別戦績</button>
        </div>

        <!-- 2-A. 全体ランキング -->
        <div id="sub-view-overall">
            <h3>🏆 メンバー別通算成績</h3>
            <div class="table-scroll">
                <table class="summary-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>名前</th>
                            <th>対局</th>
                            <th>勝率</th>
                            <th>連対率</th>
                            <th>ラス率</th>
                            <th>平均着順</th>
                            <th>通算P</th>
                            <th>収支(円)</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body">
                        <tr><td colspan="9" class="empty-text">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2-B. 個別戦績 -->
        <div id="sub-view-individual" class="hidden">
            <div class="section">
                <label>メンバーを選択</label>
                <select id="individual-member-select" onchange="renderIndividualView()">
                    <option value="">選択してください...</option>
                </select>
            </div>

            <div id="individual-content" class="hidden">
                <div class="personal-card">
                    <h4 id="indiv-name-title">梁瀬 の通算成績</h4>
                    <div class="stat-grid">
                        <div class="stat-item"><span class="stat-label">対局数</span><span id="indiv-games" class="stat-val">0</span></div>
                        <div class="stat-item"><span class="stat-label">通算スコア</span><span id="indiv-score" class="stat-val">0</span></div>
                        <div class="stat-item"><span class="stat-label">通算収支</span><span id="indiv-yen" class="stat-val">0円</span></div>
                        <div class="stat-item"><span class="stat-label">平均着順</span><span id="indiv-avgrank" class="stat-val">0.0</span></div>
                        <div class="stat-item"><span class="stat-label">勝率 (トップ)</span><span id="indiv-winrate" class="stat-val">0%</span></div>
                        <div class="stat-item"><span class="stat-label">連対率 (1-2位)</span><span id="indiv-rentai" class="stat-val">0%</span></div>
                    </div>

                    <label style="margin-top: 14px; margin-bottom: 6px;">着順内訳</label>
                    <div id="rank-bar-container" class="rank-bar-container"></div>
                </div>

                <h3>📈 個人スコア推移（その人の第1戦〜）</h3>
                <div class="chart-container">
                    <canvas id="individualChart"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
